<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation des salles – Ilios Groupe</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6B3226">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F3F1; --surface:#FFFFFF; --fg:#2A1F1C; --muted:#7A6862; --line:#E6DAD5; --line-soft:#F1E9E5;
  --accent:#85544D; --accent-fg:#FFFFFF; --accent-soft:#F2E6E3; --accent-ink:#5E3A35;
  --brand:#85544D; --brand-fg:#FFFFFF; --brand-muted:#E9D3B8; --gold:#BDA588;
  --mine:#0E7A5A; --mine-soft:#DCF1E8; --mine-ink:#0A5A42;
  --busy:#B54708; --busy-soft:#FDEBD9; --free:#0E7A5A; --free-soft:#DCF1E8;
  --danger:#B42318; --danger-soft:#FDE6E4; --now:#D92D20; --shadow:0 10px 30px rgba(20,30,50,.14);
  --f-title:"Cinzel",Georgia,"Times New Roman",serif;
  --f-ui:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141010; --surface:#1D1715; --fg:#F0E8E5; --muted:#B19E97; --line:#3A2D29; --line-soft:#271F1C;
  --accent:#C99A92; --accent-fg:#24120F; --accent-soft:#3A2623; --accent-ink:#F0D9D4;
  --brand:#5E3A35; --brand-fg:#FFFFFF; --brand-muted:#D9C3A6; --gold:#BDA588;
  --mine:#4CC79E; --mine-soft:#12342A; --mine-ink:#A7E8D0;
  --busy:#F5A35C; --busy-soft:#3A2614; --free:#4CC79E; --free-soft:#12342A;
  --danger:#F97066; --danger-soft:#3D1A17; --now:#F97066; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:1rem;font-weight:600;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;background:var(--brand);color:var(--brand-fg);border-radius:12px;padding:12px 20px}
.head-actions{margin-left:auto}
/* écran de connexion : bandeau compact et centré */
.gated header.top{width:fit-content;max-width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.35)}
header.top h1{font-family:var(--f-title);font-weight:400;font-size:1.35rem;letter-spacing:.04em;color:var(--brand-fg)}
header.top .eyebrow{color:var(--brand-muted);letter-spacing:.14em}
header.top .who{color:var(--brand-muted)}
header.top .who b{color:var(--brand-fg)}
header.top .linkbtn{color:var(--brand-fg)}
header.top .btn{background:transparent;color:var(--brand-fg);border-color:rgba(255,255,255,.6)}
header.top .btn.primary{background:var(--brand-fg);color:var(--brand);border-color:var(--brand-fg)}
@media (max-width:560px){.gated header.top{width:100%}.head-actions{margin-left:0}.brand img{height:34px}.brand .sep{display:none}header.top h1{font-size:1.2rem}}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.head-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who b{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.datebox{display:flex;align-items:center;gap:6px}
.datebox input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.datelabel{font-weight:600;font-size:1.05rem;text-transform:capitalize}
.banner{border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:12px 14px;font-size:.92rem}
.status{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.room-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.room-card .name{font-weight:600}
.room-card .meta{font-size:.82rem;color:var(--muted)}
.room-card.is-free{border-color:var(--free);background:var(--free-soft)}
.room-card.is-busy{border-color:var(--danger);background:var(--danger-soft)}
.state{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:1.6rem;font-weight:700;letter-spacing:.06em;line-height:1.1}
.state::before{content:"";width:14px;height:14px;border-radius:50%;flex:none;background:currentColor}
.state.free{color:var(--free)}
.state.busy{color:var(--danger)}
.state-sub{font-size:.88rem;font-weight:500}
.room-card.is-free .state-sub{color:var(--free)}
.room-card.is-busy .state-sub{color:var(--danger)}
.pill{align-self:flex-start;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:4px}
.pill.busy{background:var(--busy-soft);color:var(--busy)}
.pill.off{background:var(--line-soft);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scroller{overflow-x:auto}
.grid{display:grid;position:relative}
.colhead{background:var(--surface);border-bottom:1px solid var(--line);padding:10px;font-weight:600;font-size:.88rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colhead small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.timecol{position:relative;border-right:1px solid var(--line)}
.timecol span{position:absolute;right:8px;transform:translateY(-50%);font-size:.72rem;color:var(--muted)}
.roomcol{position:relative;border-right:1px solid var(--line-soft)}
.roomcol:last-child{border-right:0}
.slot{position:absolute;left:0;right:0;border:0;border-top:1px solid var(--line-soft);background:transparent;padding:0}
.slot.hour{border-top-color:var(--line)}
.slot:hover{background:var(--accent-soft)}
.slot.past{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-soft) 6px 7px)}
.bk{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 8px;background:var(--accent-soft);color:var(--accent-ink);border:0;border-left:3px solid var(--accent);text-align:left;overflow:hidden;font-size:.8rem;line-height:1.3;z-index:1}
.bk.mine{background:var(--mine-soft);color:var(--mine-ink);border-left-color:var(--mine)}
.bk b,.bk span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--line-soft)}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;margin:24px auto 0;padding:24px;display:flex;flex-direction:column;gap:14px}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:480px;padding:22px;display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.field input[readonly]{color:var(--muted)}
.codein{font-family:var(--f-mono);font-size:1.4rem!important;letter-spacing:.35em;text-align:center}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.msg{font-size:.88rem;border-radius:8px;padding:9px 12px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--free-soft);color:var(--free)}
dl.detail{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.detail dt{color:var(--muted);font-size:.85rem}
dl.detail dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.duration{font-size:.85rem;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:60}
@media (max-width:560px){.form{grid-template-columns:1fr}}
</style>
</head>

        </table></div>
      </section>
    </div>
  </div>
  <div class="empty" id="loading">Chargement…</div>
</div>
<div id="modal-root"></div>

<script>
(function(){
const STEP=30, PPM=1.3;
const S={rooms:[],bookings:[],open:420,close:1200,maxDur:0,domains:[],publicView:false,me:null,needLogin:false,
  today:null,serverNow:0,clientAt:0,date:null,loaded:false,error:null,token:null};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const dur=(a,b)=>{const m=b-a,h=Math.floor(m/60),r=m%60;return h?(h+" h"+(r?" "+pad(r):"")):(r+" min")};
function localToday(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return S.today||localToday()}
function nowMin(){if(S.today)return S.serverNow+Math.floor((Date.now()-S.clientAt)/60000);const d=new Date();return d.getHours()*60+d.getMinutes()}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function longDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function toast(t){const el=h("div",{class:"toast",role:"status",text:t});document.body.append(el);setTimeout(()=>el.remove(),2800)}
/* Adresse du serveur Apps Script (URL /exec du déploiement Application Web) */
const API_URL="https://script.google.com/macros/s/AKfycbw59jmGA_q0P9r3cZnrL_zJWGK2tyqYT_QppwCtcqjmjus8WzlZBH0JqVz7mLPhTv0jNQ/exec";
/* Appel du serveur : POST en texte brut (pas de pré-vérification CORS, aucun cookie Google envoyé) */
async function call(fn,...args){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({fn,args}),redirect:"follow"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Erreur serveur");
  return j.result;
}

/* ---------- Stockage local (session, nom) ---------- */
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
S.token=store.get("ilios-token")||null;
function setToken(t){S.token=t||null;store.set("ilios-token",t||"")}

/* ---------- Chargement ---------- */
let reqId=0;
async function load(){
  const my=++reqId,d=S.date;
  try{
    const r=await call("getData",d,S.token);
    if(my!==reqId)return;
    if(S.token&&!r.me)setToken(null); // session expirée
    Object.assign(S,{rooms:r.rooms,bookings:r.bookings,open:r.open,close:r.close,maxDur:r.maxDur||0,domains:r.domains||[],
      publicView:r.publicView,me:r.me,needLogin:!!r.needLogin,today:r.today,serverNow:r.nowMin,clientAt:Date.now(),loaded:true,error:null});
  }catch(e){if(my!==reqId)return;S.loaded=true;S.error="Impossible de charger le planning. Vérifiez votre connexion puis rechargez la page."}
  render();
}

/* ---------- Rendu ---------- */
function render(){
  $("loading").hidden=S.loaded;
  $("banner").replaceChildren(S.error?h("div",{class:"banner",text:S.error}):"");
  renderWho();
  const gated=S.loaded&&S.needLogin;
  document.body.classList.toggle("gated",gated);
  $("gate").hidden=!gated;$("main").hidden=!S.loaded||gated;
  if(gated){renderGate();return}
  if(!S.loaded)return;
  $("date").value=S.date;$("datelabel").textContent=longDate(S.date);
  $("btn-new").hidden=!S.rooms.length;
  renderStatus();renderGrid();renderList();
}
function renderWho(){
  const el=$("who");el.replaceChildren();
  if(!S.loaded)return;
  if(S.me){
    el.append(h("span",null,"Connecté : ",h("b",{text:S.me.email}),S.me.admin?" (administrateur)":""),
      h("button",{class:"linkbtn",type:"button",text:"Se déconnecter",onclick:doLogout}));
  }else if(!S.needLogin){
    el.append(h("button",{class:"btn",type:"button",text:"Se connecter",onclick:()=>openLogin()}));
  }
}
function renderGate(){
  const g=$("gate");
  g.replaceChildren(h("div",{class:"gate"},...loginFlow(()=>load())));
}
function renderStatus(){
  const el=$("status");el.replaceChildren();
  if(!S.rooms.length){el.append(h("div",{class:"room-card"},h("div",{class:"name",text:"Aucune salle configurée"}),h("div",{class:"meta",text:"Ajoutez une salle dans l'onglet « Salles » de la Google Sheet."})));return}
  const isToday=S.date===today(),n=nowMin();
  for(const r of S.rooms){
    const day=S.bookings.filter(b=>b.room===r.name).sort((a,b)=>a.start-b.start);
    const meta=[r.capacity?r.capacity+" places":null,r.location||null].filter(Boolean).join(" · ");
    const head=[h("div",{class:"name",text:r.name}),meta?h("div",{class:"meta",text:meta}):null];
    if(isToday){
      const cur=day.find(b=>b.start<=n&&n<b.end);
      if(cur){
        el.append(h("div",{class:"room-card is-busy"},head,h("div",{class:"state busy",text:"OCCUPÉE"}),
          h("div",{class:"state-sub",text:"Jusqu'à "+fmt(cur.end)+" · "+(cur.title||"Réunion")+(cur.by?" · "+cur.by:"")})));
      }else{
        const nx=day.find(b=>b.start>n);
        el.append(h("div",{class:"room-card is-free"},head,h("div",{class:"state free",text:"LIBRE"}),
          h("div",{class:"state-sub",text:nx?"Jusqu'à "+fmt(nx.start):"Pour le reste de la journée"})));
      }
    }else{
      el.append(h("div",{class:"room-card"},head,h("span",{class:"pill "+(day.length?"busy":"off"),text:day.length?day.length+" réservation"+(day.length>1?"s":"")+" ce jour":"Aucune réservation ce jour"})));
    }
  }
}
function renderGrid(){
  const g=$("grid");g.replaceChildren();
  if(!S.rooms.length){g.style.gridTemplateColumns="1fr";g.append(h("div",{class:"empty",text:"Le planning apparaîtra dès qu'une salle sera ajoutée."}));return}
  const A=S.open,B=S.close,H=(B-A)*PPM;
  g.style.gridTemplateColumns="56px repeat("+S.rooms.length+",minmax(160px,1fr))";
  g.append(h("div",{class:"colhead"}));
  for(const r of S.rooms)g.append(h("div",{class:"colhead",title:r.name},r.name,h("small",{text:r.capacity?r.capacity+" places":" "})));
  const tc=h("div",{class:"timecol",style:"height:"+H+"px"});
  for(let m=Math.ceil(A/60)*60;m<=B;m+=60)tc.append(h("span",{class:"mono",style:"top:"+((m-A)*PPM+(m===A?8:m===B?-8:0))+"px",text:fmt(m)}));
  g.append(tc);
  const t=today(),isToday=S.date===t,isPast=S.date<t,n=nowMin();
  for(const r of S.rooms){
    const col=h("div",{class:"roomcol",style:"height:"+H+"px"});
    for(let m=A;m<B;m+=STEP){
      const e=Math.min(m+STEP,B),past=isPast||(isToday&&e<=n);
      col.append(h("button",{type:"button",class:"slot"+(m%60===0?" hour":"")+(past?" past":""),style:"top:"+((m-A)*PPM)+"px;height:"+((e-m)*PPM)+"px","aria-label":r.name+" "+fmt(m),tabindex:past?"-1":null,
        onclick:()=>{if(!past)startBooking({room:r.name,start:m,end:Math.min(m+60,B)})}}));
    }
    for(const b of S.bookings.filter(x=>x.room===r.name)){
      const s=Math.max(b.start,A),e=Math.min(b.end,B);if(e<=s)continue;
      const hgt=(e-s)*PPM-2;
      col.append(h("button",{type:"button",class:"bk"+(b.mine?" mine":""),style:"top:"+((s-A)*PPM+1)+"px;height:"+hgt+"px",onclick:()=>openDetail(b)},
        h("b",{text:b.title||"Réunion"}),hgt>34?h("span",{class:"mono",text:fmt(b.start)+"–"+fmt(b.end)}):null,hgt>52?h("span",{text:b.by||""}):null));
    }
    g.append(col);
  }
  if(isToday&&n>=A&&n<=B){
    const top=g.querySelector(".colhead").offsetHeight+(n-A)*PPM;
    g.append(h("div",{class:"nowline",style:"top:"+top+"px;left:56px"}));
  }
}
function renderList(){
  const tb=$("list");tb.replaceChildren();
  const rows=[...S.bookings].sort((a,b)=>a.start-b.start||a.room.localeCompare(b.room));
  $("count").textContent=rows.length?rows.length+" réservation"+(rows.length>1?"s":""):"";
  if(!rows.length){tb.append(h("tr",null,h("td",{colspan:"5",class:"muted",text:"Aucune réservation pour ce jour."})));return}
  for(const b of rows)tb.append(h("tr",{class:"row",onclick:()=>openDetail(b)},
    h("td",{class:"mono",text:fmt(b.start)+" – "+fmt(b.end)}),h("td",{class:"mono",text:dur(b.start,b.end)}),
    h("td",{text:b.room}),h("td",{text:(b.by||"—")+(b.mine?" (vous)":"")}),h("td",{text:b.title||"—"})));
}

/* ---------- Fenêtres ---------- */
function closeModal(){$("modal-root").replaceChildren()}
function modal(...c){const ov=h("div",{class:"overlay",onclick:e=>{if(e.target===ov)closeModal()}},h("div",{class:"modal",role:"dialog","aria-modal":"true"},...c));$("modal-root").replaceChildren(ov)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function opts(sel,from,to){const o=[];for(let m=from;m<=to;m+=15)o.push(h("option",{value:String(m),selected:m===sel,text:fmt(m)}));return o}

/* ---------- Connexion ---------- */
function domainsText(){return S.domains.map(d=>"@"+d).join(", ")}
function loginFlow(onDone){
  const box=h("div",{style:"display:flex;flex-direction:column;gap:14px"});
  const stepEmail=()=>{
    const emailIn=h("input",{id:"l-email",type:"email",autocomplete:"email",placeholder:"prenom.nom@iliosgroupe.com",required:true,value:store.get("ilios-email")});
    const msg=h("div");
    const btn=h("button",{class:"btn primary block",type:"submit",text:"Recevoir un code"});
    const form=h("form",{style:"display:flex;flex-direction:column;gap:12px",onsubmit:async e=>{
      e.preventDefault();msg.replaceChildren();
      const email=emailIn.value.trim().toLowerCase();
      btn.disabled=true;btn.textContent="Envoi du code…";
      try{
        const r=await call("requestCode",email);
        if(r.error){msg.append(h("div",{class:"msg err",text:r.error}));btn.disabled=false;btn.textContent="Recevoir un code";return}
        store.set("ilios-email",email);stepCode(email);
      }catch(err){msg.append(h("div",{class:"msg err",text:"Envoi impossible. Vérifiez votre connexion puis réessayez."}));btn.disabled=false;btn.textContent="Recevoir un code"}
    }},
      h("div",{class:"field"},h("label",{for:"l-email",text:"Adresse e-mail professionnelle"}),emailIn),
      S.domains.length?h("div",{class:"hint",text:"Réservé aux adresses "+domainsText()+"."}):null,
      msg,btn);
    box.replaceChildren(h("h2",{text:"Connexion"}),h("div",{class:"hint",text:"Saisissez votre adresse e-mail. Vous recevrez un code à 6 chiffres pour vous connecter. La connexion reste active 30 jours sur cet appareil."}),form);
    setTimeout(()=>emailIn.focus(),30);
  };
  const stepCode=email=>{
    const codeIn=h("input",{id:"l-code",class:"codein",inputmode:"numeric",autocomplete:"one-time-code",maxlength:"6",placeholder:"••••••",required:true});
    const msg=h("div");
    const btn=h("button",{class:"btn primary block",type:"submit",text:"Se connecter"});
    const resend=h("button",{class:"linkbtn",type:"button",text:"Renvoyer un code",onclick:async()=>{
      msg.replaceChildren();
      try{const r=await call("requestCode",email);msg.append(h("div",{class:"msg "+(r.error?"err":"ok"),text:r.error||"Nouveau code envoyé."}))}
      catch(e){msg.append(h("div",{class:"msg err",text:"Envoi impossible. Réessayez."}))}
    }});
    const form=h("form",{style:"display:flex;flex-direction:column;gap:12px",onsubmit:async e=>{
      e.preventDefault();msg.replaceChildren();
      btn.disabled=true;btn.textContent="Vérification…";
      try{
        const r=await call("verifyCode",email,codeIn.value);
        if(r.error){msg.append(h("div",{class:"msg err",text:r.error}));btn.disabled=false;btn.textContent="Se connecter";return}
        setToken(r.token);toast("Connecté : "+r.email);onDone();
      }catch(err){msg.append(h("div",{class:"msg err",text:"Vérification impossible. Vérifiez votre connexion puis réessayez."}));btn.disabled=false;btn.textContent="Se connecter"}
    }},
      h("div",{class:"field"},h("label",{for:"l-code",text:"Code reçu par e-mail"}),codeIn),
      h("div",{class:"hint",text:"Pensez à vérifier le dossier Courrier indésirable."}),
      msg,btn,
      h("div",{class:"who"},resend,h("span",{text:"·"}),h("button",{class:"linkbtn",type:"button",text:"Changer d'adresse",onclick:stepEmail})));
    box.replaceChildren(h("h2",{text:"Code de connexion"}),h("div",{class:"hint"},"Un code a été envoyé à ",h("b",{text:email}),". Il est valable 10 minutes."),form);
    setTimeout(()=>codeIn.focus(),30);
  };
  stepEmail();
  return [box];
}
function openLogin(after){
  modal(...loginFlow(async()=>{closeModal();await load();if(after)after()}),
    h("div",{class:"actions"},h("button",{class:"btn",type:"button",text:"Annuler",onclick:closeModal})));
}
async function doLogout(){
  try{await call("logout",S.token)}catch(e){}
  setToken(null);toast("Déconnecté");load();
}

/* ---------- Réservation ---------- */
function startBooking(pre){
  if(!S.me){openLogin(()=>openForm(pre));return}
  openForm(pre);
}
function openForm(pre){
  pre=pre||{};
  const A=S.open,B=S.close;
  const roomSel=h("select",{id:"f-room"},S.rooms.map(r=>h("option",{value:r.name,selected:r.name===pre.room,text:r.name+(r.capacity?" ("+r.capacity+" pl.)":"")})));
  const dateIn=h("input",{id:"f-date",type:"date",value:S.date<today()?today():S.date,min:today()});
  let st=pre.start;
  if(st==null){st=S.date===today()?Math.ceil(nowMin()/15)*15:A;if(st<A)st=A;if(st>=B)st=A}
  const maxEnd=s=>S.maxDur?Math.min(s+S.maxDur,B):B;
  const startSel=h("select",{id:"f-start"},opts(st,A,B-15));
  const endSel=h("select",{id:"f-end"},opts(Math.min(pre.end??(st+60),maxEnd(st)),st+15,maxEnd(st)));
  const titleIn=h("input",{id:"f-title",maxlength:"80",placeholder:"Point hebdomadaire",required:true});
  const nameIn=h("input",{id:"f-name",maxlength:"60",placeholder:"Prénom NOM",required:true,value:store.get("ilios-name")});
  const emailIn=h("input",{id:"f-email",readonly:true,value:S.me?S.me.email:""});
  const svcIn=h("input",{id:"f-svc",maxlength:"60",placeholder:"Direction, service…",value:store.get("ilios-svc")});
  const durEl=h("div",{class:"duration mono"}),msg=h("div");
  const upd=()=>{const a=+startSel.value,b=+endSel.value;durEl.textContent=b>a?"Durée : "+dur(a,b):"L'heure de fin doit suivre l'heure de début"};
  startSel.onchange=()=>{
    const s=+startSel.value,prev=+endSel.value,mx=maxEnd(s);
    const want=prev>s&&prev<=mx?prev:Math.min(s+60,mx);
    endSel.replaceChildren(...opts(want,s+15,mx));upd();
  };
  endSel.onchange=upd;upd();
  const limitNote=S.maxDur?h("div",{class:"duration",text:"Durée maximale par réservation : "+dur(0,S.maxDur)}):null;
  const submit=h("button",{class:"btn primary",type:"submit",text:"Réserver"});
  const form=h("form",{class:"form",onsubmit:async e=>{
    e.preventDefault();msg.replaceChildren();
    const p={room:roomSel.value,date:dateIn.value,start:+startSel.value,end:+endSel.value,title:titleIn.value.trim(),by:nameIn.value.trim(),svc:svcIn.value.trim()};
    if(!p.date||p.end<=p.start){msg.append(h("div",{class:"msg err",text:"Vérifiez la date et les horaires : la fin doit être après le début."}));return}
    submit.disabled=true;submit.textContent="Vérification…";
    try{
      const r=await call("book",p,S.token);
      if(r.needLogin){setToken(null);closeModal();await load();openLogin(()=>openForm(pre));return}
      if(r.error){msg.append(h("div",{class:"msg err",text:r.error}));submit.disabled=false;submit.textContent="Réserver";return}
      store.set("ilios-name",p.by);store.set("ilios-svc",p.svc);
      if(p.date!==S.date)S.date=p.date;
      closeModal();toast("Réservation enregistrée");load();
    }catch(err){msg.append(h("div",{class:"msg err",text:"Enregistrement impossible. Vérifiez votre connexion puis réessayez."}));submit.disabled=false;submit.textContent="Réserver"}
  }},
    h("div",{class:"field full"},h("label",{for:"f-room",text:"Salle"}),roomSel),
    h("div",{class:"field full"},h("label",{for:"f-date",text:"Date"}),dateIn),
    h("div",{class:"field"},h("label",{for:"f-start",text:"Début"}),startSel),
    h("div",{class:"field"},h("label",{for:"f-end",text:"Fin"}),endSel),
    h("div",{class:"field full"},durEl,limitNote),
    h("div",{class:"field full"},h("label",{for:"f-title",text:"Objet de la réunion"}),titleIn),
    h("div",{class:"field"},h("label",{for:"f-name",text:"Réservé par"}),nameIn),
    h("div",{class:"field"},h("label",{for:"f-svc",text:"Service (facultatif)"}),svcIn),
    h("div",{class:"field full"},h("label",{for:"f-email",text:"E-mail"}),emailIn),
    h("div",{class:"field full"},msg),
    h("div",{class:"actions field full"},h("button",{class:"btn",type:"button",text:"Annuler",onclick:closeModal}),submit));
  modal(h("h2",{text:"Nouvelle réservation"}),form);
  setTimeout(()=>titleIn.focus(),30);
}

function openDetail(b){
  const msg=h("div");
  const del=h("button",{class:"btn danger",type:"button",text:"Annuler la réservation"});
  del.onclick=async()=>{
    if(!del.dataset.step){del.dataset.step="1";del.textContent="Confirmer l'annulation";del.classList.add("solid");return}
    del.disabled=true;msg.replaceChildren();
    try{
      const r=await call("cancel",b.id,S.token);
      if(r.needLogin){setToken(null);closeModal();load();return}
      if(r.error){msg.append(h("div",{class:"msg err",text:r.error}));del.disabled=false;return}
      closeModal();toast("Réservation annulée");load();
    }catch(e){msg.append(h("div",{class:"msg err",text:"Annulation impossible. Vérifiez votre connexion puis réessayez."}));del.disabled=false}
  };
  const upcoming=b.date>today()||(b.date===today()&&b.end>nowMin());
  const canCancel=upcoming&&S.me&&(b.mine||S.me.admin);
  modal(
    h("div",null,h("div",{class:"eyebrow",text:b.room}),h("h2",{text:b.title||"Réunion"})),
    h("dl",{class:"detail"},
      h("dt",{text:"Date"}),h("dd",{text:longDate(b.date)}),
      h("dt",{text:"Horaire"}),h("dd",{class:"mono",text:fmt(b.start)+" – "+fmt(b.end)}),
      h("dt",{text:"Durée"}),h("dd",{class:"mono",text:dur(b.start,b.end)}),
      h("dt",{text:"Réservé par"}),h("dd",{text:(b.by||"—")+(b.mine?" (vous)":"")}),
      b.svc?h("dt",{text:"Service"}):null,b.svc?h("dd",{text:b.svc}):null,
      b.created?h("dt",{text:"Enregistrée le"}):null,b.created?h("dd",{class:"mono",text:b.created}):null),
    msg,
    h("div",{class:"actions"},canCancel?del:null,h("button",{class:"btn",type:"button",text:"Fermer",onclick:closeModal})));
}

/* ---------- Navigation ---------- */
function go(d){S.date=d;S.bookings=[];render();load()}
$("prev").onclick=()=>go(addDays(S.date,-1));
$("next").onclick=()=>go(addDays(S.date,1));
$("today").onclick=()=>go(today());
$("date").onchange=e=>{if(e.target.value)go(e.target.value)};
$("btn-new").onclick=()=>startBooking({});
const idle=()=>document.visibilityState==="visible"&&!$("modal-root").firstChild&&!S.needLogin;
setInterval(()=>{if(idle())load()},60000);
document.addEventListener("visibilitychange",()=>{if(idle())load()});

S.date=localToday();render();load();
})();
</script>
</body>
</html>
